# Copia este archivo a .streamlit/secrets.toml y sustituye los ejemplos.
# NO subas secrets.toml ni el JSON de la cuenta de servicio a GitHub.
# Pega todo el contenido configurado en Advanced settings > Secrets al desplegar.
[firebase]
type = "service_account"
project_id = "TU_PROJECT_ID"
client_email = "TU_CUENTA_DE_SERVICIO@TU_PROJECT_ID.iam.gserviceaccount.com"
private_key = """-----BEGIN PRIVATE KEY-----
REEMPLAZA_POR_TU_CLAVE_PRIVADA
-----END PRIVATE KEY-----
"""
token_uri = "https://oauth2.googleapis.com/token"

[postgres]
host = "TU_HOST.aivencloud.com"
port = 12345 # Sustituye por el puerto exacto de tu servicio.
dbname = "guests"
user = "avnadmin"
password = "TU_PASSWORD"
sslmode = "require"
# Si usas verify-full, añade el CA público de Aiven al proyecto y configura:
# sslmode = "verify-full"
# sslrootcert = "certs/ca.pem"
